name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to create the release under (e.g. v1.1.0)'
        required: true
        type: string

# The only workflow that may write, and only to publish a release. Note
# that a compromise here still cannot ship an update to anyone: releases
# are only trusted once signed with the maintainer's offline key, which
# does not exist on any runner.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64
      - name: Test first
        run: make test
      - name: Cross-compile spindle.exe
        run: make
      - name: Checksum
        run: |
          cd build
          sha256sum spindle.exe > SHA256SUMS
          cat SHA256SUMS
      # Third-party action, so it is pinned to a commit rather than a
      # movable tag: a tag can be repointed at new code, a commit cannot.
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            build/spindle.exe
            build/SHA256SUMS
          generate_release_notes: true
          draft: false
