name: ci

on:
  push:
    branches: [main, "dev-**"]
  pull_request:

# Least privilege. Nothing here needs to write to the repository, and a
# public repository runs workflows for code it did not write.
permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host test suite (ASan, UBSan, TSan)
        run: make test
      - name: The MFT assembler against a real NTFS image
        run: |
          sudo apt-get update
          sudo apt-get install -y ntfs-3g
          sudo tools/make-ntfs-image.sh build/demo.ntfs
          make test-image
      - name: Concurrency stress walk
        run: make stress

  # Coverage-guided fuzzing of every parser, briefly, on every push. A
  # finding here is a crash file in the job's output; replay it with the
  # standalone driver (build/fuzz_<target> FILE) to reproduce.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang and the libFuzzer runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-dev
      - name: Fuzz each parser for thirty seconds
        run: make fuzz-lib FUZZ_SECONDS=30

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64
      - name: Cross-compile spindle.exe
        run: make
      - name: Cross-compile the Windows-side tests
        run: make test-win
      - uses: actions/upload-artifact@v4
        with:
          name: spindle-exe
          path: build/spindle.exe
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: spindle-test-win
          path: build/test_win.exe
          retention-days: 14

  # The Windows-only pieces, run on real Windows: where a path is judged to
  # live (a share, an odd spelling, an absent letter), what may be cached,
  # and the DPAPI-sealed cache round trip with no name readable on disk.
  windows-tests:
    runs-on: windows-latest
    needs: cross-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spindle-test-win
      - name: Classification and sealed cache
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\test_win.exe -Wait -NoNewWindow -PassThru
          if ($p.ExitCode -ne 0) { throw "test_win failed with exit $($p.ExitCode)" }

  # Windows on ARM. llvm-mingw is the only toolchain that targets it, and it
  # is not packaged, so CI fetches a pinned release. Marked non-blocking:
  # nothing here can run an ARM64 binary to prove it works, so a green tick
  # means "it compiles and links", not "it is tested".
  cross-build-arm64:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llvm-mingw
        run: |
          curl -fsSL -o llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20250114/llvm-mingw-20250114-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar -xf llvm-mingw.tar.xz
          echo "$PWD/llvm-mingw-20250114-ucrt-ubuntu-20.04-x86_64/bin" >> "$GITHUB_PATH"
      - name: Cross-compile for ARM64
        run: make ARCH=aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: spindle-exe-arm64
          path: build/spindle.exe
          retention-days: 14

  # The auto-update crypto, exercised on real Windows: generate a keypair,
  # sign the built exe, verify the manifest, then prove fail-closed by
  # corrupting one byte and by verifying with the wrong key. Wine cannot
  # run this (its ECDSA is incomplete), which is exactly why it lives here.
  update-roundtrip:
    runs-on: windows-latest
    needs: cross-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spindle-exe
      - name: Sign, verify, tamper, refuse
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Start-Process -FilePath .\spindle.exe -ArgumentList "--gen-update-key" -Wait -NoNewWindow
          if (-not (Test-Path update-key.txt)) { throw "no keypair written" }
          $lines = Get-Content update-key.txt
          $pub  = [string](($lines | Where-Object { $_ -match "public" }  | Select-Object -First 1) -replace ".*: ", "")
          $priv = [string](($lines | Where-Object { $_ -match "private" } | Select-Object -First 1) -replace ".*: ", "")
          if ($pub.Length -lt 80 -or $priv.Length -lt 100) { throw "keypair looks wrong: pub=$($pub.Length) priv=$($priv.Length)" }
          [IO.File]::WriteAllText((Join-Path $PWD "priv.key"), $priv)

          Start-Process -FilePath .\spindle.exe -ArgumentList @("--sign-release", "spindle.exe", "priv.key", "v0.0.0-ci") -Wait -NoNewWindow
          if (-not (Test-Path manifest.json)) { throw "signing wrote no manifest: $(Get-Content sign-error.txt -ErrorAction SilentlyContinue)" }
          if (-not (Test-Path manifest.sig))  { throw "signing wrote no signature" }

          $p = Start-Process -FilePath .\spindle.exe -ArgumentList @("--verify-update-manifest", "manifest.json", "manifest.sig", $pub) -Wait -NoNewWindow -PassThru
          if ($p.ExitCode -ne 0) { throw "a freshly signed manifest failed to verify" }
          Write-Host "verify: OK"

          $bytes = [IO.File]::ReadAllBytes("manifest.json")
          $bytes[$bytes.Length - 5] = $bytes[$bytes.Length - 5] -bxor 1
          [IO.File]::WriteAllBytes("tampered.json", $bytes)
          $p = Start-Process -FilePath .\spindle.exe -ArgumentList @("--verify-update-manifest", "tampered.json", "manifest.sig", $pub) -Wait -NoNewWindow -PassThru
          if ($p.ExitCode -eq 0) { throw "a tampered manifest verified - fail-closed is broken" }
          Write-Host "tamper: REJECTED (good)"

          Start-Process -FilePath .\spindle.exe -ArgumentList "--gen-update-key" -Wait -NoNewWindow
          $pub2 = [string](((Get-Content update-key.txt) | Where-Object { $_ -match "public" } | Select-Object -First 1) -replace ".*: ", "")
          $p = Start-Process -FilePath .\spindle.exe -ArgumentList @("--verify-update-manifest", "manifest.json", "manifest.sig", $pub2) -Wait -NoNewWindow -PassThru
          if ($p.ExitCode -eq 0) { throw "the wrong key verified - fail-closed is broken" }
          Write-Host "wrong key: REJECTED (good)"

  # The network-permission and cache-policy acceptance run, end to end
  # under Wine on a virtual display, against a prefix the script builds
  # from nothing. Wine draws its own chrome, so this proves behaviour,
  # not looks. Non-blocking until it has proven steady on the hosted
  # runner: a flaky acceptance job teaches people to ignore red.
  wine-acceptance:
    runs-on: ubuntu-latest
    needs: cross-build
    continue-on-error: true
    env:
      WINEDLLOVERRIDES: "mscoree,mshtml="
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spindle-exe
          path: build
      - name: Install Wine and the display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wine xvfb openbox xdotool x11-utils imagemagick
      - name: Build the prefix
        run: tools/wine-prefix.sh
      - name: Acceptance run
        run: tools/wine-corpo-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wine-acceptance
          path: build/uitest
          retention-days: 7

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse assistant references, personal paths and secrets
        env:
          # An optional private denylist, kept as a repository secret so the
          # pattern of personal terms never lives in the tree. Absent on
          # forks, where the generic rules still apply.
          SPINDLE_HYGIENE_DENY: ${{ secrets.HYGIENE_DENY }}
        run: tools/hygiene.sh
